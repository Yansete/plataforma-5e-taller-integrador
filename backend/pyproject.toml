[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plataforma5e"
version = "0.1.0"
description = "Backend de Plataforma 5E"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.20",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
# CI instala ".[dev,postgres]": el controlador de PostgreSQL ya está en las dependencias base.
postgres = [
    "psycopg[binary]>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plataforma5e*", "app*"]

[tool.setuptools.package-data]
plataforma5e = ["adapters/outbound/fixtures/*.json"]

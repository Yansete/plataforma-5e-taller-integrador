# TA-001 · Integración continua: corre todas las pruebas en cada push y en cada pull request.
# Resultado visible en la pestaña «Actions» del repositorio y en cada commit (✓ o ✗).
# Mapa de pruebas: docs/pruebas.md
name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tipos, unitarias con cobertura, build y punta a punta con el backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Pruebas unitarias con cobertura (vitest, caja blanca)
        # TA-008: falla si la cobertura baja de 80 % en líneas, sentencias y funciones (70 % en ramas).
        run: npm run test:cobertura
      - name: Resumen de cobertura del frontend
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const fila = (n, k) => `| ${n} | ${t[k].pct} % | ${t[k].covered} de ${t[k].total} |`;
            console.log(["### Cobertura del frontend (servicios y utilidades)", "",
              "| Medida | Cobertura | Cubiertas |", "|---|---|---|",
              fila("Líneas", "lines"), fila("Sentencias", "statements"),
              fila("Funciones", "functions"), fila("Ramas", "branches")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el reporte de cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage
          retention-days: 14
          if-no-files-found: ignore
      - name: Compilar
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar el backend (las pruebas en navegador lo levantan con una base SQLite nueva)
        run: pip install -e ../backend
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta (Playwright con el backend real)
        run: npm run test:e2e
      - name: Guardar el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  backend:
    name: Backend (unitarias, arquitectura, integración, cobertura y punta a punta)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma
          POSTGRES_DB: plataforma5e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que el backend está en el repositorio
        id: hay
        working-directory: .
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No existe backend/pyproject.toml: se omiten las pruebas del backend (ver EN-021)."
          fi
      - uses: actions/setup-python@v5
        if: steps.hay.outputs.backend == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias
        if: steps.hay.outputs.backend == 'true'
        run: pip install -e ".[dev,postgres]" pytest-cov
      - name: Pruebas unitarias y de arquitectura
        if: steps.hay.outputs.backend == 'true'
        run: python -m pytest tests/unit tests/arquitectura --junitxml=reportes/unitarias.xml
      - name: Pruebas de integración (API en proceso)
        if: steps.hay.outputs.backend == 'true'
        run: python -m pytest tests/integration --junitxml=reportes/integracion.xml
      - name: Cobertura del dominio y de los casos de uso (caja blanca)
        # TA-008: falla si la cobertura de domain/ y application/ baja de 80 %.
        if: steps.hay.outputs.backend == 'true'
        run: >-
          python -m pytest tests/unit tests/arquitectura tests/integration -q
          --cov=plataforma5e.domain --cov=plataforma5e.application
          --cov-report=term-missing --cov-report=xml:reportes/cobertura.xml
          --cov-report=html:reportes/cobertura-html --cov-fail-under=80
      - name: Resumen de cobertura del backend
        if: always() && steps.hay.outputs.backend == 'true' && hashFiles('backend/.coverage') != ''
        run: |
          echo "### Cobertura del backend (dominio y casos de uso)" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Punta a punta con SQLite (servidor real por HTTP)
        if: steps.hay.outputs.backend == 'true'
        run: python -m pytest tests/e2e --junitxml=reportes/e2e-sqlite.xml
      - name: Punta a punta con PostgreSQL
        if: steps.hay.outputs.backend == 'true'
        env:
          E2E_DATABASE_URL: postgresql+psycopg://plataforma:plataforma@localhost:5432/plataforma5e
        run: python -m pytest tests/e2e --junitxml=reportes/e2e-postgres.xml
      - name: Guardar los reportes de pytest
        if: always() && steps.hay.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pytest
          path: backend/reportes
          retention-days: 14
